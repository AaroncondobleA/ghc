<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petróleo y Soberanía Nacional — U.E. Padre Reyes Cueta</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #262626;
      --text: #e5e5e5;
      --accent: #ffffff;
      --muted: #a3a3a3;
      --gold: #d4af37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 1rem;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ENCABEZADO INSTITUCIONAL */
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.2rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 1rem;
    }

    /* SVG de la Bandera de Venezuela */
    .flag-svg {
      width: 55px;
      height: 38px;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    /* Logo del Liceo adaptado */
    .school-logo {
      height: 48px;
      max-width: 120px;
      object-fit: contain;
      /* Adapta la imagen eliminando el fondo blanco en modo oscuro */
      filter: grayscale(100%) invert(100%) brightness(1.8);
      mix-blend-mode: screen;
      flex-shrink: 0;
    }

    .institution-info {
      text-align: center;
      flex-grow: 1;
    }

    .institution-info h2 {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .institution-info h3 {
      font-size: 0.95rem;
      color: var(--accent);
      font-weight: 600;
    }

    h1 {
      color: var(--accent);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 0.2rem;
    }

    /* FICHAS Y TARJETAS DESPLEGABLES */
    details {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    details[open] {
      border-color: #404040;
    }

    summary {
      padding: 1rem 1.25rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: '+';
      font-size: 1.2rem;
      color: var(--muted);
      transition: transform 0.2s;
    }

    details[open] summary::after {
      content: '−';
      color: var(--accent);
    }
